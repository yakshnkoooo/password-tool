name: Python CI

on:
  push:
    branches: [ main, master, development, release ]
  pull_request:
    branches: [ main, master, development ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
      
      - name: Integration smoke test
        run: |
          python -c "
          from password_tool import generate, strength
          pwd = generate(16)
          assert len(pwd) == 16, 'Длина пароля не 16'
          assert strength(pwd) in ('medium', 'strong'), 'Пароль слишком слабый'
          assert strength('123') == 'weak', 'Слабый пароль не распознан'
          print('Integration smoke test passed:', pwd, '->', strength(pwd))
          "
